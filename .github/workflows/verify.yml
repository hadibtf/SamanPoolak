name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build management app
        run: npm run build:platform

      - name: Build employee app
        run: npm run build:employee

  backend:
    name: PHP validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Lint backend PHP files
        run: |
          find server -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l dev-router.php

      - name: Run production validation
        run: php server/tests/production_validation.php
